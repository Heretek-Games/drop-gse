[package]
name = "gse-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Core emulator patcher, DLL manager and config generator for drop-gse"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
