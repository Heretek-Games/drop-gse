name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # @heretek-games/zerotier-mesh is a sibling workspace package (the canonical mesh
      # provider). Fetch and build it before installing drop-gse.
      - name: Fetch mesh provider (workspace sibling)
        run: |
          git clone --depth 1 https://github.com/Heretek-Games/drop-zerotier.git ../drop-zerotier
          npm --prefix ../drop-zerotier/packages/mesh-core install
          npm --prefix ../drop-zerotier/packages/mesh-core run build
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # @heretek-games/zerotier-mesh is a sibling workspace package (the canonical mesh
      # provider). Fetch and build it before installing drop-gse.
      - name: Fetch mesh provider (workspace sibling)
        run: |
          git clone --depth 1 https://github.com/Heretek-Games/drop-zerotier.git ../drop-zerotier
          npm --prefix ../drop-zerotier/packages/mesh-core install
          npm --prefix ../drop-zerotier/packages/mesh-core run build
      - run: npm ci
      - run: npm run typecheck

  rust:
    name: Rust (gse-engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/gse-engine
      - run: cargo fmt --check
        working-directory: packages/gse-engine
      - run: cargo clippy -- -D warnings
        working-directory: packages/gse-engine
      - run: cargo test
        working-directory: packages/gse-engine

  sonarcloud:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    # Requires SONAR_TOKEN secret once the project is onboarded on sonarcloud.io.
    # The `secrets` context is not available in job-level `if`, so the gate
    # lives on the scan step via its env mapping below.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for blame-based analysis
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # @heretek-games/zerotier-mesh is a sibling workspace package (the canonical mesh
      # provider). Fetch and build it before installing drop-gse.
      - name: Fetch mesh provider (workspace sibling)
        run: |
          git clone --depth 1 https://github.com/Heretek-Games/drop-zerotier.git ../drop-zerotier
          npm --prefix ../drop-zerotier/packages/mesh-core install
          npm --prefix ../drop-zerotier/packages/mesh-core run build
      - run: npm ci
      - run: npm run typecheck
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        if: env.SONAR_TOKEN != ''
