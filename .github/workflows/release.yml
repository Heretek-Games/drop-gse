name: Release Drop Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sidecars:
    name: Build gse-engine sidecars (${{ matrix.dir }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            dir: linux-x64
            bin: gse-engine
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            dir: windows-x64
            bin: gse-engine.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            dir: macos-arm64
            bin: gse-engine
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Build gse-engine sidecar binary
        uses: houseabsolute/actions-rust-cross@9a1618ffb70e8374ab5f48fcccea3ebeacf57971 # v1.0.5
        with:
          toolchain: nightly
          target: ${{ matrix.target }}
          args: "--locked --release"
          working-directory: packages/gse-engine
          strip: true

      - name: Stage sidecar binary
        shell: bash
        run: |
          mkdir -p "sidecars/${{ matrix.dir }}"
          cp "packages/gse-engine/target/${{ matrix.target }}/release/${{ matrix.bin }}" "sidecars/${{ matrix.dir }}/${{ matrix.bin }}"

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540478e122f210621e2a26c2 # actions/upload-artifact@v4.6.2
        with:
          name: sidecar-${{ matrix.dir }}
          path: sidecars/${{ matrix.dir }}
          if-no-files-found: error

  release:
    name: Build, validate, and publish .dropplugin
    runs-on: ubuntu-latest
    needs: build-sidecars
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Test
        run: npm test

      - name: Download sidecar binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974cac6a6715fc9e7a1f442 # actions/download-artifact@v4.3.0
        with:
          pattern: sidecar-*
          path: plugin-bundle/sidecars
          merge-multiple: true

      - name: Record sidecar digests in the bundle manifest
        run: node scripts/sidecar-manifest.mjs

      - name: Assemble plugin bundle
        run: npm run bundle:build

      - name: Validate manifest
        run: npm run validate

      - name: Pack plugin archive
        run: npm run pack

      - name: Generate checksums
        id: pkg
        run: |
          FILE=$(find dist-packages -name "*.dropplugin" -print -quit)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE" > "$FILE.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.pkg.outputs.path }}.sha256
          name: ${{ steps.pkg.outputs.name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
