name: Release Drop Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build, validate, and publish .dropplugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Test
        run: npm test

      - name: Build gse-engine sidecar binaries (linux-x64 musl)
        uses: houseabsolute/actions-rust-cross@9a1618ffb70e8374ab5f48fcccea3ebeacf57971 # v1.0.5
        with:
          toolchain: nightly
          target: x86_64-unknown-linux-musl
          args: "--locked --release"
          working-directory: packages/gse-engine
          strip: true

      - name: Build gse-engine sidecar binaries (windows-x64)
        uses: houseabsolute/actions-rust-cross@9a1618ffb70e8374ab5f48fcccea3ebeacf57971 # v1.0.5
        with:
          toolchain: nightly
          target: x86_64-pc-windows-gnu
          args: "--locked --release"
          working-directory: packages/gse-engine
          strip: true

      - name: Build gse-engine sidecar binaries (macos-arm64)
        uses: houseabsolute/actions-rust-cross@9a1618ffb70e8374ab5f48fcccea3ebeacf57971 # v1.0.5
        with:
          toolchain: nightly
          target: aarch64-apple-darwin
          args: "--locked --release"
          working-directory: packages/gse-engine
          strip: true

      - name: Stage sidecar binaries into the plugin bundle
        run: |
          mkdir -p plugin-bundle/sidecars/linux-x64 plugin-bundle/sidecars/windows-x64 plugin-bundle/sidecars/macos-arm64
          cp packages/gse-engine/target/x86_64-unknown-linux-musl/release/gse-engine plugin-bundle/sidecars/linux-x64/gse-engine
          cp packages/gse-engine/target/x86_64-pc-windows-msvc/release/gse-engine.exe plugin-bundle/sidecars/windows-x64/gse-engine.exe
          cp packages/gse-engine/target/aarch64-apple-darwin/release/gse-engine plugin-bundle/sidecars/macos-arm64/gse-engine

      - name: Record sidecar digests in the bundle manifest
        run: node scripts/sidecar-manifest.mjs

      - name: Assemble plugin bundle
        run: npm run bundle:build

      - name: Validate manifest
        run: npm run validate

      - name: Pack plugin archive
        run: npm run pack

      - name: Generate checksums
        id: pkg
        run: |
          FILE=$(find dist-packages -name "*.dropplugin" -print -quit)
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$FILE")" >> "$GITHUB_OUTPUT"
          sha256sum "$FILE" > "$FILE.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.path }}
            ${{ steps.pkg.outputs.path }}.sha256
          name: ${{ steps.pkg.outputs.name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
